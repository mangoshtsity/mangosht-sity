<title>منقوشة ستي</title>

<style>
  /* Layout: one centered card on a warm field; logo tile on top, headline, two store buttons. */
  :root {
    --bg: #f7e6c4;
    --bg-glow: rgba(255, 255, 255, 0.6);
    --bg-gold: rgba(245, 166, 35, 0.32);
    --surface: #ffffff;
    --fg: #2b2622;
    --muted: #6d6460;
    --red: #c0272d;
    --gold: #f5a623;
    --btn: #141211;
    --btn-hover: #2c2826;
    --btn-fg: #ffffff;
    --shadow: 0 20px 50px rgba(120, 70, 10, 0.18);
    color-scheme: light;
    --font: "Tajawal", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: var(--font);
    font-size: 16px;
    color: var(--fg);
    background:
      radial-gradient(circle at 12% 8%, var(--bg-glow) 0, transparent 45%),
      radial-gradient(circle at 92% 96%, var(--bg-gold) 0, transparent 50%),
      var(--bg);
    padding-block: 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    min-width: 0;
    background: var(--surface);
    border-radius: 32px;
    padding: 36px 26px 30px;
    text-align: center;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 8px;
    background: linear-gradient(90deg, var(--red), var(--gold));
  }
  .logo-tile {
    background: #ffffff;
    border-radius: 24px;
    padding: 10px;
    margin: 0 auto 24px;
    width: 220px;
    max-width: 100%;
  }
  .logo-tile img { display: block; width: 100%; height: auto; border-radius: 16px; }
  h1 {
    font-size: clamp(19px, 6vw, 26px);
    font-weight: 800;
    line-height: 1.55;
    color: var(--red);
    text-wrap: balance;
    margin-bottom: 6px;
  }
  h1 span { display: block; white-space: nowrap; }
  .sub {
    font-size: 17px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 26px;
  }
  .stores { display: flex; flex-direction: column; gap: 14px; }
  .store {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--btn);
    color: var(--btn-fg);
    text-decoration: none;
    padding: 12px 22px;
    border-radius: 18px;
    text-align: right;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18);
    transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .store:hover { background: var(--btn-hover); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25); }
  .store:active { transform: scale(0.98); }
  .store:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .store svg { width: 32px; height: 32px; flex-shrink: 0; }
  .store small { display: block; font-size: 12px; opacity: 0.8; font-weight: 400; }
  .store strong { display: block; font-size: 19px; font-weight: 700; line-height: 1.2; direction: ltr; text-align: right; }
  .foot { margin-top: 20px; font-size: 13px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    .store { transition: none; }
  }
</style>

</head>
